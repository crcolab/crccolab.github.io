    <script>
      // Stale HTML after a redeploy can name a deleted entry chunk. Then no app JS runs and the page
      // stays blank. Reload once (same sessionStorage guard as src/hooks/chunkReload.ts); if the guard
      // blocks it, show a plain fallback instead of a blank page.
      (function () {
        var KEY = 'kit-chunk-reload';
        var WINDOW_MS = 30000;
        window.addEventListener(
          'error',
          function (event) {
            var target = event.target;
            if (!target || target.tagName !== 'SCRIPT' || target.type !== 'module') return;
            var canReload = false;
            try {
              var last = Number(sessionStorage.getItem(KEY));
              if (!(last > 0 && Date.now() - last < WINDOW_MS)) {
                sessionStorage.setItem(KEY, String(Date.now()));
                canReload = true;
              }
            } catch (error) {
              canReload = false;
            }
            if (canReload) {
              location.reload();
              return;
            }
            var root = document.getElementById('root');
            if (root) {
              root.innerHTML =
                '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;box-sizing:border-box;font-family:\'Noto Sans TC\',\'PingFang TC\',system-ui,sans-serif;background:#FBFAF6;color:#1C1828;text-align:center">' +
                '<p style="margin:0;font-size:20px;font-weight:700">頁面載入失敗，可能是網站剛更新。</p>' +
                '<button type="button" onclick="location.reload()" style="min-height:48px;padding:0 20px;border:0;border-radius:12px;background:#46288B;color:#FFFFFF;font:inherit;font-weight:700;cursor:pointer">重新載入</button>' +
                '</div>';
            }
          },
          true,
        );
      })();
    </script>
